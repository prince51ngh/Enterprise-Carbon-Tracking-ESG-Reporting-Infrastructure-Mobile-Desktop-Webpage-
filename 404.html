<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found // VerdeLedger</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="minimalist.css">
    <style>
        .error-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 70vh;
        }
        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: var(--g-300);
            line-height: 1;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="index.html" class="site-brand">
                <img src="favicon.svg" alt="Logo" width="20" height="20" style="vertical-align: middle; margin-right: 6px;">
                Verde<span>Ledger</span>
            </a>
        </div>
    </header>

    <main class="page-body">
        <div class="error-page fade-in-up">
            <div class="error-code">404</div>
            <h2>Page Not Found</h2>
            <p style="max-width: 400px; margin: 16px auto 24px;">We couldn't find the page you're looking for. It might have been moved, renamed, or doesn't exist.</p>
            <a href="index.html" class="hero-cta">Return to Overview →</a>
